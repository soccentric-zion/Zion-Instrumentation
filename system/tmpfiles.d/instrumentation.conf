# /run/instrumentation with correct ownership and modes (REQ §13).
#
# One entry, not three. "D" recreates the directory empty on every boot,
# which is what we want for a socket directory — a stale socket from the
# previous boot must never be inherited. It was previously declared three
# times (a D and two d lines for the same path), which is contradictory.
#
# Spoke registration sockets are created inside it by istate: mode 0660,
# owned instr-<daemon>:instr, so socket permissions enforce the call graph
# (§3.1, §10). Ctrl sockets are created 0600 root-only by each daemon (§3.2).
D /run/instrumentation 0755 instr-istate instr -

# Application log sink (§7.7). Colocated applications append to app.log and
# logmanager collects it. 2770 with the setgid bit: members of instr-apps
# write, logmanager reads via its membership of the same group, and the
# setgid bit keeps the group on files the application creates.
d /var/log/instrumentation 2770 instr-logmanager instr-apps -
