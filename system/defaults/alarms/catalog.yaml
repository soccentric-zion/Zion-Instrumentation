# Alarm catalog seeded into /pst/system/alarms/catalog.yaml (REQ §6, §7.6).
# Alarms merges the shipped catalog into this on every update, preserving
# operator edits to severities and text.
# Arches Instrumentation — master alarm catalog (REQ §8).
# Code-generated into a shared C++ header at build time; the same catalog is
# consumed by HQ so alarms render without hardcoding.
# 32-bit ID layout (locked):
#   [31:28] domain  hardware / software / network / application / fault
#   [27:20] module  which daemon or subsystem (256)
#   [19:16] type    X.733: equipment / communications / processing-error /
#                   quality-of-service / environmental
#   [15:0]  index   alarm within that module (65536)
# Per entry: id, symbolic name, default severity, probable cause, specific
# problem, description, escalation rule, auto-clear policy, HQ-reportable.
version: 1
entries:
