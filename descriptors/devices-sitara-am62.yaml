board: sitara-am62
devices:
  - name: status-led
    kind: led
    controls: [led_set, led_blink]
    checks:
      - name: blink-ack
        op: led_blink_ack
  - name: gpio-user
    kind: gpio
    params:
      line: 421
    controls: [gpio_set]
    checks:
      - name: toggle
        op: gpio_toggle_read
  - name: can0
    kind: can
    controls: [can_send, can_recv]
    params:
      iface: can0
    checks:
      - name: loopback
        op: can_loopback
