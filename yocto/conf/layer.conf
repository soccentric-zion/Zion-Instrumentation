# Arches Instrumentation — Yocto layer configuration (REQ §13).
#
# Without this file yocto/ is a directory of recipes, not a layer: bitbake has
# no BBFILE_COLLECTIONS entry to bind the recipes to, so the README's
# `BBLAYERS += "/path/to/instrumentation/yocto"` fails at parse time. See
# Task.md D-01.

BBPATH .= ":${LAYERDIR}"

BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "instrumentation"
BBFILE_PATTERN_instrumentation = "^${LAYERDIR}/"
# Same priority meta-arches uses: this layer adds recipes rather than
# overriding anyone else's, so it needs no precedence over the BSP.
BBFILE_PRIORITY_instrumentation = "10"

# Every layer named here provides something instrumentation.bb actually needs,
# checked against the recipes in Arches-OS's kas layer set:
#   core               — the bitbake/oe-core base.
#   openembedded-layer — grpc, protobuf, yaml-cpp (DEPENDS), plus hostapd,
#                        linuxptp and gpsd (RDEPENDS).
#   networking-layer   — nftables, wireguard-tools, chrony (RDEPENDS).
#   swupdate           — swupdate, the update engine the ota daemon shells.
LAYERDEPENDS_instrumentation = "core openembedded-layer networking-layer swupdate"

# Matches meta-arches and the poky pin in Arches-OS
# (kas/repos/poky.yaml: branch kirkstone). This previously said "scarthgap",
# which does not match either pin and would fail bitbake's layer series
# compatibility check the moment this layer was actually wired into a kas
# build (see Arches Task.md D-08).
LAYERSERIES_COMPAT_instrumentation = "kirkstone"
